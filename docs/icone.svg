<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#2d2622"/>
      <stop offset="1" stop-color="#110e0c"/>
    </linearGradient>
    <clipPath id="corte"><rect x="8" y="8" width="240" height="240" rx="58"/></clipPath>
    <filter id="nevoa" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="faixa" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="brilho" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <linearGradient id="onda" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd58a"/>
      <stop offset=".5" stop-color="#fff4e0"/>
      <stop offset="1" stop-color="#ffb3c4"/>
    </linearGradient>
    <linearGradient id="borda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#fundo)"/>

  <g clip-path="url(#corte)">
    <!-- a névoa: manchas de luz âmbar, vermelha e rosa -->
    <g filter="url(#nevoa)">
      <circle cx="88" cy="160" r="62" fill="#f2a93b" opacity=".95"/>
      <circle cx="172" cy="104" r="58" fill="#d5402f" opacity=".8"/>
      <circle cx="160" cy="182" r="46" fill="#e8708f" opacity=".7"/>
      <circle cx="70" cy="74" r="34" fill="#7a4cc2" opacity=".55"/>
    </g>
  </g>

  <!-- a onda de som, com brilho por trás -->
  <path id="o" d="M52 128 C 64 128, 66 112, 76 112 S 88 150, 100 150 S 112 88, 128 88 S 144 168, 156 168 S 168 116, 180 116 S 192 128, 204 128"
        fill="none" stroke="#ffcf8a" stroke-width="16" stroke-linecap="round" opacity=".55" filter="url(#brilho)"/>
  <path d="M52 128 C 64 128, 66 112, 76 112 S 88 150, 100 150 S 112 88, 128 88 S 144 168, 156 168 S 168 116, 180 116 S 192 128, 204 128"
        fill="none" stroke="url(#onda)" stroke-width="9" stroke-linecap="round"/>

  <rect x="9" y="9" width="238" height="238" rx="57" fill="none" stroke="url(#borda)" stroke-width="2"/>
</svg>
